name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - "*.md"
      - LICENSE
  pull_request:
    branches: [main]
    paths-ignore:
      - docs/**
      - "*.md"
      - LICENSE

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build
        run: go build ./cmd/otpkit

  cross-compile:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p artifacts
          go build -trimpath -ldflags "-s -w" -o artifacts/otpkit-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/otpkit
      - uses: actions/upload-artifact@v4
        with:
          name: otpkit-${{ matrix.goos }}-${{ matrix.goarch }}
          path: artifacts/otpkit-${{ matrix.goos }}-${{ matrix.goarch }}
