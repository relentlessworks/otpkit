name: Tag & Release

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - "*.md"
      - LICENSE

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tagged: ${{ steps.check.outputs.tagged }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read version
        id: version
        run: echo "version=v$(cat VERSION)" >> $GITHUB_OUTPUT
      - name: Check if tag exists
        id: check
        run: |
          if git tag -l "${{ steps.version.outputs.version }}" | grep -q .; then
            echo "tagged=true" >> $GITHUB_OUTPUT
          else
            echo "tagged=false" >> $GITHUB_OUTPUT
          fi
      - name: Create tag
        if: steps.check.outputs.tagged == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.version }}
          git push origin ${{ steps.version.outputs.version }}

  cross-compile:
    needs: tag
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p artifacts
          go build -trimpath -ldflags "-s -w" -o artifacts/otpkit-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/otpkit
          cd artifacts
          tar czf otpkit-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz otpkit-${{ matrix.goos }}-${{ matrix.goarch }}
      - uses: actions/upload-artifact@v4
        with:
          name: otpkit-${{ matrix.goos }}-${{ matrix.goarch }}
          path: artifacts/otpkit-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz

  release:
    needs: [tag, cross-compile]
    runs-on: ubuntu-latest
    if: needs.tag.outputs.tagged == 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Generate checksums
        run: |
          cd artifacts
          find . -name "*.tar.gz" -exec sha256sum {} \; > checksums.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.tag.outputs.version }}"
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes "Release $VERSION" \
            artifacts/**/*.tar.gz \
            artifacts/checksums.txt
